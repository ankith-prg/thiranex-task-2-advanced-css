<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Ankith Shanbhogue for development opportunities.">
    <title>Contact | Ankith Shanbhogue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header role="banner">
        <nav aria-label="Primary Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
        <button id="theme-toggle">Toggle Theme</button>
    </header>

    <main role="main">
        <section aria-labelledby="contact-heading">
            <h1 id="contact-heading">Contact Me</h1>
            
            <form action="#" method="POST" aria-label="Contact Form">
                <div style="margin-bottom: 10px;">
                    <label for="name-input">Name:</label><br>
                    <input type="text" id="name-input" name="name" required aria-required="true">
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label for="email-input">Email Address:</label><br>
                    <input type="email" id="email-input" name="email" required aria-required="true">
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label for="message-input">Message:</label><br>
                    <textarea id="message-input" name="message" rows="5" required aria-required="true"></textarea>
                </div>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Ankith Shanbhogue. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
